name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Lint 🧹
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout/@v4

      - name: Install uv 
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install deps
        run: uv sync 

      - name: Lint Ansible playbooks
        run: ansible-lint --fix
