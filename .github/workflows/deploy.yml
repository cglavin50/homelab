name: Lint & Deploy Homelab 🚀

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Deploy 🚀
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout/@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ansible
          chmod 600 ~/.ssh/ansible
          ssh-keyscan -H 192.168.1.10 >> ~/.ssh/known_hosts 

      - name: Install uv 
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install deps
        run: uv sync 

      - name: Lint Ansible playbooks
        run: ansible-lint --fix

      - name: Install Make
        run: sudo apt-get install -y make

      - name: Run Makefile Deploy
        run: make deploy
