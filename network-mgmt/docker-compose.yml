services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ../logs/caddy:/var/log/caddy
    networks:
      - caddy_net
      - app_net

  adguard_home:
    image: adguard/adguardhome:latest
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 3000:3000/tcp
    volumes:
      - adguard_config:/opt/adguardhome/conf # app config
      - adguard_work:/opt/adguardhome/work # app working dir
    network_mode: "host"


volumes:
  caddy_data:
  caddy_config:
  adguard_config:
    driver: local
  adguard_work:
    driver: local

networks:
  caddy_net:
    driver: bridge
  app_net:
    external: true
