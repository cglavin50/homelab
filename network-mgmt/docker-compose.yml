services:
  caddy:
    container_name: caddy
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ../logs/caddy:/var/log/caddy
    networks:
      - caddy_net
      - app_net


volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  caddy_net:
    driver: bridge
  app_net:
    external: true
