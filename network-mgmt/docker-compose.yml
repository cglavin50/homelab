services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config

  adguard_home:
    image: adguard/adguardhome:latest
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 3000:3000/tcp
    volumes:
      - adguard_config:/opt/adguardhome/conf # app config
      - adguard_work:/opt/adguardhome/work # app working dir


volumes:
  caddy_data:
  caddy_config:
  adguard_config:
    driver: local
  adguard_work:
    driver: local
