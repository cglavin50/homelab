---
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      DOMAIN: "https://vault.home"
      SIGNUPS_ALLOWED: "false"
    volumes:
      - ./vw-data:/data
    networks:
      - vw_net

volumes:
  vw-data:
networks:
  vw_net:
    name: vw_net
