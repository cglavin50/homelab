---
services:
  caddy:
    container_name: caddy
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    networks:
      - caddy_net
      - adguard_net
      - homepage_net
      - vw_net

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  caddy_net:
    driver: bridge
    name: caddy_net
  homepage_net:
    external: true
  adguard_net:
    external: true
  vw_net:
    external: true
