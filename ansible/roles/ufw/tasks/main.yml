- name: Ensure UFW is installed
  apt:
    name: ufw
    state: present
  become: true

- name: Configure UFW logging
  community.general.ufw:
    logging: 'on'

- name: Set default deny UFW policy
  community.general.ufw:
    policy: deny
    direction: incoming
  become: true

- name: Allow configured ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
  loop: "{{ ufw_allowed_ports }}"
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
